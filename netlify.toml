# Netlify configuration for the STFS "Ask the Inventory" tool
#
# Repo layout:
#   index.html                 (rename chat.html to index.html)
#   netlify/functions/ask.js
#   netlify/functions/hq-redeem.js
#   netlify.toml               (this file)
#
# Deploy:
#   1. Create a NEW GitHub repo (separate from the reorder engine).
#   2. Put chat.html in as index.html, and ask.js under netlify/functions/.
#   3. Connect the repo to a new Netlify site.
#   4. In Netlify > Site settings > Environment variables, add:
#         ANTHROPIC_API_KEY      your key from console.anthropic.com
#         SUPABASE_URL           https://zhgfzpztvmazueuxkipm.supabase.co
#         SUPABASE_SERVICE_KEY   STFS service-role key (Supabase > Settings > API)
#         STFD_SUPABASE_URL      https://qdfwovnhlaaocgawukto.supabase.co
#         STFD_SUPABASE_ANON_KEY STFD publishable key (also in index.html)
#         STFD_SUPABASE_SERVICE_ROLE_KEY  STFD service-role key (hq-redeem only)
#         ASK_ALLOWED_EMAILS     comma-separated rollout list
#         HQ_STFD_HANDOFF_SECRET shared with PJCJ hq-handoff-consume
#         PJCJ_ANON_KEY          PJCJ publishable key (hq-redeem only)
#         HQ_CONSUME_URL         optional PJCJ consume URL
#      Set the STFD URL and publishable key before deploying. If either is
#      missing, every question returns 503. HQ links also need the handoff
#      secret, the PJCJ publishable key, and the STFD service-role key.
#   5. Deploy. Questions are /.netlify/functions/ask.
#      HQ redeem is /.netlify/functions/hq-redeem.
#
# The service-role key is powerful — it bypasses RLS. It lives ONLY in
# Netlify's environment, never in the repo or the browser. The ask
# function only ever calls the twelve ask_* RPCs, so its blast radius is
# limited to those read-only queries. STFD_SUPABASE_SERVICE_ROLE_KEY is
# also server-only: hq-redeem uses it to find an existing STFD user and
# mint a session. It is never sent to the browser or to PJCJ.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # STFD URL + publishable key are intentionally in index.html too.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,STFD_SUPABASE_URL,STFD_SUPABASE_ANON_KEY,HQ_CONSUME_URL"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
